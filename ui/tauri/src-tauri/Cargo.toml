[package]
name = "edgewb-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
html-escape = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.5.5", features = [] }
tauri-plugin-dialog = "2.0.0"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
