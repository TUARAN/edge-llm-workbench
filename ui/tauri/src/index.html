<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edge LLM Workbench Desktop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand" data-i18n="app_name">Edge LLM Workbench</div>
          <div class="subtitle" data-i18n="app_subtitle">Offline • Private • Auditable</div>
        </div>
        <div class="topbar-right">
          <label class="lang-label" for="lang-select" data-i18n="lang_label">语言</label>
          <select id="lang-select" class="lang-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </header>
      <main class="content">
        <section class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="overview" data-i18n="tab_overview">Overview</button>
            <button class="tab" data-tab="workflows" data-i18n="tab_workflows">Workflows</button>
            <button class="tab" data-tab="runs" data-i18n="tab_runs">Runs</button>
            <button class="tab" data-tab="architecture" data-i18n="tab_architecture">Architecture</button>
          </div>
          <div class="tab-content" id="overview"></div>
          <div class="tab-content hidden" id="workflows"></div>
          <div class="tab-content hidden" id="runs"></div>
          <div class="tab-content hidden" id="architecture"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
